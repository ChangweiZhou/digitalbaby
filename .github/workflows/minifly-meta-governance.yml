name: MiniFly partial recursive-governance tests
on:
  pull_request:
    paths:
      - '.claude/skills/minifly-*/**'
      - 'tools/minifly_meta_guard/**'
      - 'AGENTS.md'
      - '.github/workflows/minifly-meta-governance.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  partial-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/minifly_meta_guard
      - name: Run executable regression cases
        run: python3 -m unittest discover -s tools/minifly_meta_guard -p 'test_*.py' -v
      - name: Verify meta-only PR scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t paths < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          args=(python3 tools/minifly_meta_guard/guard.py verify-scope --mode meta)
          for path in "${paths[@]}"; do args+=(--changed-file "$path"); done
          "${args[@]}"
